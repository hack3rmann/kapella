[workspace]
resolver = "3"
members = [
    "crates/kapella-job-info",
    "crates/kapella-runtime-dir",
    "crates/kapellmeister",
    "crates/musikant",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
authors = ["Varov Svyatoslav <slava-varov3@mail.ru>"]
repository = "https://github.com/hack3rmann/kapella.git"

[workspace.dependencies]
kapella-runtime-dir = { path = "crates/kapella-runtime-dir" }
kapella-job-info = { path = "crates/kapella-job-info" }
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
display-error-chain = "0.2.2"
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
cbor2 = { version = "1.1.6", features = ["tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
smallvec = { version = "1.16.3", features = ["const_new", "union", "const_generics", "serde"] }
url = { version = "2.5.8", features = ["serde"] }
smallstr = { version = "0.3.1", features = ["union", "serde"] }
waywe_daemonize = "0.5.0"
