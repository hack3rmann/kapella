[workspace]
resolver = "3"
members = [
    "crates/kapella-runtime-dir",
    "crates/kapellmeister",
    "crates/musikant",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
authors = ["Varov Svyatoslav <slava-varov3@mail.ru>"]
repository = "https://github.com/hack3rmann/kapella.git"

[workspace.dependencies]
kapella-runtime-dir = { path = "crates/kapella-runtime-dir" }
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
display-error-chain = "0.2.2"
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
